<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Checking{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #1a1a1a; }

    .header { background: #1a1a1a; color: white; padding: 1rem 1.25rem; }
    .header h1 { font-size: 1.1rem; font-weight: 600; }
    .header .count { color: #aaa; font-weight: 400; }

    .container { max-width: 640px; margin: 0 auto; padding: 1rem 1rem 3rem; }

    /* Cards */
    .card { background: white; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card-meta { font-size: 0.75rem; color: #888; margin-bottom: 0.3rem; }
    .card-intent { font-size: 0.9rem; font-weight: 600; color: #222; margin-bottom: 0.4rem; }
    .card-preview { font-size: 0.875rem; color: #555; line-height: 1.45; margin-bottom: 0.75rem; white-space: pre-wrap; word-break: break-word; }
    .card-link { display: block; text-align: right; font-size: 0.875rem; color: #0066cc; text-decoration: none; font-weight: 500; }

    /* Labeled sections */
    .section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #888; margin-bottom: 0.4rem; letter-spacing: 0.06em; }
    .message-box { background: #f7f7f7; border-left: 3px solid #ccc; padding: 0.75rem; border-radius: 0 4px 4px 0; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1rem; white-space: pre-wrap; word-break: break-word; }
    .draft-box   { background: #fffbeb; border-left: 3px solid #f59e0b; padding: 0.75rem; border-radius: 0 4px 4px 0; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; white-space: pre-wrap; word-break: break-word; }

    /* Buttons */
    .btn { display: block; width: 100%; padding: 0.85rem; border-radius: 7px; font-size: 1rem; font-weight: 600; border: none; cursor: pointer; text-align: center; margin-bottom: 0.5rem; }
    .btn-approve { background: #22c55e; color: white; }
    .btn-reject  { background: #ef4444; color: white; }
    .btn-login   { background: #1a1a1a; color: white; }

    /* Reject form */
    .reject-form { margin-top: 0.75rem; border-top: 1px solid #eee; padding-top: 0.75rem; }
    .reject-form label { display: block; font-size: 0.8rem; font-weight: 600; color: #666; margin-bottom: 0.3rem; margin-top: 0.6rem; }
    textarea { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.875rem; font-family: inherit; line-height: 1.4; resize: vertical; }

    /* Misc */
    .back-link { display: inline-block; margin-bottom: 1rem; color: #0066cc; text-decoration: none; font-size: 0.9rem; }
    .empty-state { text-align: center; padding: 4rem 1rem; color: #aaa; font-size: 1rem; }
    .error { background: #fef2f2; color: #dc2626; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }

    /* Login */
    .login-wrap { max-width: 360px; margin: 5rem auto; padding: 1.5rem; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .login-wrap h2 { text-align: center; margin-bottom: 1.5rem; font-size: 1.3rem; }
    input[type=password] { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 7px; font-size: 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
