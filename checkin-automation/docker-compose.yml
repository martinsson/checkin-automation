# env_file is `.env` (adjacent to this file), not the central repo-root ../.env.
# On the server, `make deploy` rsyncs this module to REMOTE_DIR and `.env` is scp'd
# alongside it, so `.env` resolves there. For LOCAL docker runs, copy ../.env here first
# (`cp ../.env .env`); for normal local dev use `make run`, which sources ../.env directly.
services:
  daemon:
    build: .
    image: checkin-daemon
    command: python scripts/run.py
    env_file: .env
    environment:
      DB_PATH: /data/checkin.db
    volumes:
      - data:/data
    restart: unless-stopped

  web:
    build: .
    image: checkin-web
    command: uvicorn src.web.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_PATH: /data/checkin.db
    volumes:
      - data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  data:
